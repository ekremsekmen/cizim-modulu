#  DENETİM — her push'ta ve pull request'te hızlı denetim ( kontrol.py ).
#  Tam denetim ( yavaş çizim testleri + girdi taraması ) elle başlatılır:
#  GitHub → Actions → Denetim → Run workflow.  Arayüz testleri ( tarayıcı
#  ister ) şimdilik yalnız yerelde:  kontrol.py arayuz.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hizli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py hizli
        env:
          KONTROL_IS: auto

  tam:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py tam
        env:
          KONTROL_IS: auto
      - run: python kontrol.py tarama
