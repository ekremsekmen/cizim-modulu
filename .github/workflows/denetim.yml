#  DENETİM — programın bütün testleri ( kontrol.py ).
#
#  Çalışma akışı:  değişiklik bir dala push'lanır ve PR açılır;  ağır testler
#  ( tam denetim, girdi taraması ) burada koşar — main'e ancak hepsi
#  yeşilken bağlanır.  Yerelde yalnız hızlı denetim koşar ( kontrol.py, ~3 dk ).
#
#    PR ve elle başlatma ( Actions → Denetim → Run workflow ):
#      tam      lint + biçim, hesap, bütün çizim testleri ( yavaş dahil ),
#               ön yüz ( on-yuz/:  tip, lint, test, derleme ), açık programın
#               uçları ve kök sayfası, ön yüz gerçek tarayıcıda ( uçtan uca )
#      tarama   510 düzenin hükmü kayıtla ( testler/tarama_hukumleri.json ), yazı ve fiziksel tutarlılık
#    main'e push:  yalnız hızlı denetim ( PR'da hepsi zaten koştu )
#
#  Dakika tasarrufu ( özel depoda Actions dakikası sınırlı ):  aynı PR'a yeni
#  push gelince eski koşu iptal edilir.  Program değişince bu dosya değişmez:
#  testleri kontrol.py bulur.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hizli:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: on-yuz/package-lock.json
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py hizli
        env:
          KONTROL_IS: auto

  tam:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: on-yuz/package-lock.json
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python -m playwright install --with-deps chromium
      - run: python kontrol.py tam
        env:
          KONTROL_IS: auto

  tarama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py tarama
