#  DENETİM — programın bütün testleri ( kontrol.py ).
#
#  Çalışma akışı:  değişiklik bir dala push'lanır ve PR açılır;  ağır testler
#  ( tam denetim, girdi taraması ) burada koşar — main'e ancak hepsi
#  yeşilken bağlanır.  Yerelde yalnız hızlı denetim koşar ( kontrol.py, ~3 dk ).
#
#    PR ve elle başlatma ( Actions → Denetim → Run workflow ):
#      tam      lint + biçim, hesap, bütün çizim testleri ( yavaş dahil ),
#               ön yüz ( on-yuz/:  tip, lint, test, derleme ), açık programın
#               uçları ve kök sayfası, ön yüz gerçek tarayıcıda ( uçtan uca;
#               arıza matrisinin beş türü yalnız elle başlatınca, PR'da ikisi )
#      tarama   558 düzenin hükmü kayıtla ( testler/tarama_hukumleri.json ), yazı ve fiziksel tutarlılık
#      avan_tarama  avan seçicisi 563 kuyuda ( araclar/avan_tarama.py ):  dönen her asansör
#               uygulamanın uçlarından temiz mi, hükümler kayıtla aynı mı
#               ( testler/avan_tarama_hukumleri.json );  sonuç iş çıktısı olarak saklanır
#    main'e push:  yalnız hızlı denetim ( PR'da hepsi zaten koştu )
#
#  Dakika tasarrufu ( özel depoda Actions dakikası sınırlı ):  aynı PR'a yeni
#  push gelince eski koşu iptal edilir.  Program değişince bu dosya değişmez:
#  testleri kontrol.py bulur.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hizli:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: on-yuz/package-lock.json
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py hizli
        env:
          KONTROL_IS: auto

  tam:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    #  Sınır takılan işe karşıdır, bütçe değil:  iş 26 Eki'de 41–43 dk sürüyordu,
    #  kotla giriş testleriyle ( PR #70 ) 45'i aştı ve uçtan ucada kesildi;  7 Kas
    #  PR #106'da 59:31 sürdü ( 60'a kıl payı ) — 75
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: on-yuz/package-lock.json
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python -m playwright install --with-deps chromium
      - run: python kontrol.py tam
        env:
          KONTROL_IS: auto
          #  Arıza matrisinin beş türü yalnız elle başlatınca ( PR'da ikisi — test_on_yuz_uctan_uca )
          ARIZA_HEPSI: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

  tarama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py tarama

  avan_tarama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    #  Öbür işlerle yan yana koşar ( tam işini uzatmaz ).  Seçici saatsiz kiptedir;  ilk
    #  ölçüm:  455 senaryo CI'da 20 dk ( 4 işçi, 79 dk işlemci );  14 Kas 18 hazır asansörle 563 senaryo ( yenileri seyrek — 819 tam eksen 80 dk sürdü )
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-kilit.txt -r requirements-gelistirme.txt
      - run: python kontrol.py avan_tarama
        env:
          KONTROL_IS: auto
      #  Hükümler değiştiyse ( ya da kayıt henüz yoksa ) yeni kayıt buradan alınır
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avan-tarama
          path: cikti/avan_tarama/
          retention-days: 14
